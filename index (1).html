<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image map example: area elements missing alt text</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #1a1a1a; }
    img { max-width: none; border: 1px solid #999; }
    .figure { overflow-x: auto; }
    code { background: #eee; padding: 0 .25em; }
  </style>
</head>
<body>
  <h1>Seating chart</h1>
  <p>Select a section of the seating chart to see the seats in that row.</p>

  <div class="figure">
    <!-- Intentional accessibility failure: the <area> elements below have no alt attribute. -->
    <img src="seating.jpg" alt="seatingChart" usemap="#seatingMap" width="600" height="579">

    <map name="seatingMap">
    <area shape="rect" coords="34,44,270,350" href="row1.htm">
    <area shape="rect" coords="290,172,333,250" href="row2.htm">
    <area shape="rect" coords="337,300,44" href="row3.htm">
    </map>
  </div>

  <p><small>This page is a test example. Each <code>&lt;area&gt;</code> link has no text alternative, so screen readers can only announce the link's file name.</small></p>
</body>
</html>
